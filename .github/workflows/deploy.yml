name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (корень сайта)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src/main

      - name: Checkout v2 (публикуется под /v2/)
        uses: actions/checkout@v4
        with:
          ref: v2
          path: src/v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/main/package-lock.json
            src/v2/package-lock.json

      - name: Build main
        working-directory: src/main
        run: |
          npm ci
          npm run build

      - name: Build v2
        working-directory: src/v2
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -R src/main/dist/. site/
          mkdir -p site/v2
          cp -R src/v2/dist/. site/v2/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
