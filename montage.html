<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Монтаж роликов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --y: #ffd60a;
        --g: #171613;
        --g2: #23211d;
        --w: #f3eee4;
        --ink: #171613;
        --mut: #d9d3c5;
        --sans: "Onest", system-ui, "Segoe UI", Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--g);
        color: var(--w);
        font: 400 18px/1.55 var(--sans);
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }
      }
      a {
        color: inherit;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      main {
        position: relative;
        z-index: 1;
      }
      .mono {
        font: 700 13px/1.4 var(--mono);
        letter-spacing: 0.02em;
        color: var(--mut);
      }
      h1,
      h2,
      h3 {
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0;
      }
      h2 {
        font-size: clamp(34px, 5.2vw, 76px);
      }
      section {
        position: relative;
        padding: 12vh clamp(20px, 6vw, 96px);
      }
      .t {
        background: transparent;
      }
      .d {
        background: var(--g);
      }
      .l {
        background: var(--w);
        color: var(--ink);
      }
      .l .mono {
        color: #4a463d;
      }
      .static .t {
        background: var(--g);
      }
      .static #gl,
      .static #tl3d {
        display: none;
      }
      section[data-cut] {
        scroll-margin-top: 0;
      }
      section[data-cut]::before {
        content: attr(data-cut);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 30px;
        background: var(--y);
        color: var(--ink);
        font: 700 12px/30px var(--mono);
        padding: 0 clamp(20px, 6vw, 96px);
        z-index: 2;
        background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(0, 0, 0, 0.18) 22px 24px);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--y);
        color: var(--ink);
        font: 800 18px/1 var(--sans);
        padding: 18px 28px;
        border-radius: 999px;
        text-decoration: none;
        border: 0;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--y);
        outline-offset: 3px;
      }
      .btn.big {
        font-size: clamp(22px, 3vw, 40px);
        padding: 26px 44px;
      }
      .ghost {
        background: #fff;
        color: var(--ink);
        border: 3px solid var(--y);
        font: 800 16px/1 var(--sans);
        padding: 14px 22px;
        border-radius: 999px;
        cursor: pointer;
      }
      header {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 34px);
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px clamp(16px, 3vw, 40px);
        pointer-events: none;
      }
      header > * {
        pointer-events: auto;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 800;
        background: var(--g);
        color: var(--w);
        padding: 5px 14px 5px 5px;
        border-radius: 999px;
      }
      .logo i {
        width: 38px;
        height: 38px;
        border: 2px solid var(--w);
        border-radius: 10px;
        display: grid;
        place-items: center;
        font: 800 20px/1 var(--sans);
        font-style: normal;
        position: relative;
        background: var(--g);
      }
      .logo i::after {
        content: "";
        position: absolute;
        right: -5px;
        top: -5px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--y);
        box-shadow: 0 0 12px var(--y);
      }
      .hl {
        background: var(--g);
        border: 2px solid var(--y);
        color: var(--w);
        padding: 10px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 8px clamp(16px, 3vw, 40px) calc(8px + env(safe-area-inset-bottom, 0px));
        background: rgba(23, 22, 19, 0.88);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      #bar .tr {
        position: relative;
        flex: 1;
        height: 8px;
        background: #4a463d;
        border-radius: 4px;
      }
      #bar .fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: var(--y);
        border-radius: 4px;
      }
      #bar .ph {
        position: absolute;
        top: -6px;
        width: 3px;
        height: 20px;
        background: var(--y);
        box-shadow: 0 0 10px var(--y);
        left: 0;
      }
      #bar .tk {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 14px;
        background: var(--w);
        opacity: 0.55;
      }
      #tc {
        color: var(--y);
        min-width: 92px;
      }
      #fl {
        position: fixed;
        inset: 0;
        background: var(--y);
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }
      #fl {
        background: radial-gradient(120% 90% at 50% 50%, rgba(255, 214, 10, 0) 35%, rgba(255, 214, 10, 0.9) 100%);
      }
      #fl.on {
        animation: fl 0.9s ease-in-out;
      }
      @keyframes fl {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 0.3;
        }
        100% {
          opacity: 0;
        }
      }
      #fl.hard {
        background: var(--y);
      }
      #fl.hard.on {
        animation: flh 0.25s ease-out;
      }
      @keyframes flh {
        0% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
        }
      }
      #vg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(120% 90% at 62% 50%, rgba(23, 22, 19, 0) 30%, rgba(23, 22, 19, 0.55) 100%), linear-gradient(90deg, rgba(23, 22, 19, 0.6), rgba(23, 22, 19, 0.18) 55%, rgba(23, 22, 19, 0.3));
      }
      .static #vg {
        display: none;
      }
      #hero h1,
      #hero p.lead {
        text-shadow: 0 2px 26px rgba(0, 0, 0, 0.65);
      }
      /* hero */
      #hero {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 0.35fr);
        gap: clamp(20px, 3vw, 56px);
        align-items: center;
        padding-top: 130px;
        padding-bottom: 70px;
      }
      #hero h1 {
        font-size: clamp(38px, 4.4vw, 72px);
        overflow-wrap: break-word;
        hyphens: auto;
      }
      #hero p.lead {
        max-width: 30ch;
        font-size: clamp(18px, 1.6vw, 24px);
        color: var(--w);
        margin: 22px 0 30px;
      }
      .slotw {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .slot {
        position: relative;
        height: min(66svh, 660px);
        height: min(66vh, 660px);
        aspect-ratio: 9/16;
        border-radius: 22px;
        overflow: hidden;
        cursor: pointer;
        background: #2c2924;
        border: 2px solid #4a463d;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
      }
      .slot .pic {
        position: absolute;
        inset: 0;
        background: radial-gradient(80% 50% at 50% 30%, #6b5a3a, transparent), linear-gradient(160deg, #3a3630, #1b1a17);
        transition: filter 0.5s;
      }
      .slot[data-s="0"] .pic {
        filter: grayscale(1) contrast(0.8) brightness(0.8);
      }
      .slot[data-s="1"] .pic {
        filter: grayscale(0.5);
      }
      .slot .lab {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        color: #fff;
        text-shadow: 0 1px 4px #000;
      }
      .slot .mid {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0 24px;
        font: 700 14px/1.5 var(--mono);
        color: #fff;
        text-shadow: 0 1px 6px #000;
      }
      .segs {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 16px;
        height: 14px;
        display: flex;
        gap: 4px;
      }
      .segs b {
        flex: 1;
        background: #fff;
        opacity: 0.9;
        border-radius: 3px;
        transition:
          flex 0.5s,
          background 0.5s,
          opacity 0.5s;
      }
      .slot[data-s="0"] .segs b {
        flex: 1;
        gap: 0;
        background: #aaa;
        border-radius: 0;
        margin-right: -4px;
      }
      .slot[data-s="1"] .segs b:nth-child(3n) {
        flex: 0.2;
        opacity: 0.25;
      }
      .slot[data-s="2"] .segs b {
        background: var(--y);
        opacity: 1;
      }
      .slot[data-s="2"] .segs b:nth-child(even) {
        flex: 1.6;
      }
      .ctl {
        display: flex;
        gap: 14px;
        align-items: center;
        width: 100%;
        justify-content: space-between;
      }
      #cnt {
        color: #fff;
      }
      #cap {
        min-height: 4.6em;
        width: min(100%, 340px);
        font-size: 15px;
        line-height: 1.45;
        color: var(--w);
      }
      #cap b {
        color: var(--y);
      }
      /* BA */
      #ba {
        display: grid;
        grid-template-columns: auto minmax(0, 38ch);
        gap: clamp(24px, 6vw, 100px);
        justify-content: center;
        align-items: center;
        min-height: 110vh;
      }
      .cmp {
        position: relative;
        height: min(72vh, 660px);
        aspect-ratio: 9/16;
        border-radius: 18px;
        overflow: hidden;
        border: 2px solid #4a463d;
        background: #2c2924;
        --p: 50%;
      }
      .cmp .ly {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 700 13px/1.5 var(--mono);
        text-align: center;
        padding: 20px;
        color: #fff;
      }
      .cmp .raw {
        background: linear-gradient(160deg, #4a463d, #23211d);
        filter: grayscale(1) brightness(0.8);
      }
      .cmp .fin {
        background: radial-gradient(70% 40% at 50% 30%, #a8873a, transparent), linear-gradient(160deg, #3a3630, #1b1a17);
        clip-path: inset(0 0 0 var(--p));
      }
      .cmp .ln {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--p);
        width: 3px;
        background: var(--y);
        box-shadow: 0 0 14px var(--y);
      }
      .cmp input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: ew-resize;
        margin: 0;
      }
      .cmp .tag {
        position: absolute;
        top: 12px;
        background: var(--g);
        padding: 4px 8px;
        border-radius: 6px;
        color: #fff;
      }
      #ba ul {
        list-style: none;
        padding: 0;
        margin: 26px 0 0;
        display: grid;
        gap: 16px;
      }
      #ba li {
        padding-left: 22px;
        position: relative;
        font-size: 19px;
      }
      #ba li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.5em;
        width: 10px;
        height: 10px;
        background: var(--y);
        border-radius: 50%;
      }
      .pn {
        background: rgba(23, 22, 19, 0.82);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        padding: 22px 24px;
        border-radius: 16px;
      }
      /* works */
      #works {
        min-height: 140vh;
        padding-bottom: 5vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #works > .pn:first-child {
        position: sticky;
        top: 78px;
        z-index: 2;
      }
      #wcap {
        position: sticky;
        bottom: 64px;
        z-index: 2;
      }
      #wcap {
        min-height: 3em;
        color: var(--w);
        font-size: 20px;
        max-width: 46ch;
      }
      #wcap span {
        color: var(--y);
      }
      /* principles */
      #pr {
        padding-bottom: 20vh;
      }
      #pr .stk {
        height: 320vh;
        position: relative;
      }
      #pr .sticky {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        display: grid;
        align-items: center;
      }
      #pr .pp {
        grid-area: 1/1;
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        pointer-events: none;
      }
      #pr .pp.on {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #pr .pp .pn {
        max-width: 440px;
      }
      .static #pr .stk {
        height: auto;
      }
      .static #pr .sticky {
        position: static;
        height: auto;
        display: block;
      }
      .static #pr .pp {
        opacity: 1;
        transform: none;
        pointer-events: auto;
        margin-bottom: 24px;
      }
      #pr .pp h3 {
        font-size: clamp(34px, 4.4vw, 64px);
        margin: 8px 0 14px;
      }
      #pr .intro {
        max-width: 640px;
        margin-bottom: 6vh;
      }
      /* pause */
      #pause {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: left;
      }
      #pause p {
        margin: 0;
        font: 800 clamp(48px, 11vw, 190px)/1 var(--sans);
        letter-spacing: -0.04em;
      }
      #pause mark {
        display: inline-block;
        background: var(--y);
        color: var(--ink);
        line-height: 0.9;
        padding: 0.05em 0.12em 0.1em;
        margin-top: 0.12em;
      }
      /* formats */
      .fm {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 6vh;
      }
      .fc {
        background: var(--g2);
        border-radius: 20px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 360px;
      }
      .fc:nth-child(2) {
        margin-top: 40px;
      }
      .fc:nth-child(3) {
        margin-top: 80px;
      }
      .obj {
        height: 170px;
        display: grid;
        place-items: center;
        perspective: 700px;
      }
      .obj > div {
        transition: transform 0.15s;
      }
      .ph1 {
        width: 76px;
        height: 136px;
        border: 3px solid var(--w);
        border-radius: 14px;
        background: linear-gradient(160deg, #6b5a3a, #2a2418);
      }
      .ph2 {
        width: 190px;
        height: 107px;
        border: 3px solid var(--w);
        border-radius: 8px;
        background: linear-gradient(160deg, #6b5a3a, #2a2418);
      }
      .ph3 {
        display: grid;
        gap: 7px;
      }
      .ph3 b {
        display: block;
        height: 20px;
        background: var(--y);
        border-radius: 4px;
      }
      .ph3 b:nth-child(2) {
        width: 70%;
        background: var(--w);
        margin-left: 20px;
      }
      .ph3 b:nth-child(3) {
        width: 50%;
        background: #8a8478;
        margin-left: 60px;
      }
      .fc h3 {
        font-size: 30px;
      }
      .fc p {
        margin: 0;
      }
      .pers {
        margin-top: 60px;
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 600;
        max-width: 36ch;
      }
      /* process */
      #proc {
        overflow: hidden;
      }
      .pl {
        position: relative;
        margin-top: 8vh;
        --f: 0;
      }
      .pl::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 4px;
        background: rgba(0, 0, 0, 0.15);
        transform: translateX(-50%);
      }
      .pl::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        height: calc(var(--f) * 100%);
        width: 4px;
        background: var(--y);
        transform: translateX(-50%);
        box-shadow: 0 0 12px var(--y);
      }
      .st {
        position: relative;
        width: calc(50% - 50px);
        padding: 20px 0 70px;
      }
      .st:nth-child(even) {
        margin-left: calc(50% + 50px);
      }
      .st:nth-child(odd) {
        text-align: right;
      }
      .st h3 {
        font-size: clamp(28px, 3.4vw, 50px);
      }
      .st p {
        margin: 10px 0 0;
        font-size: 19px;
      }
      .st::after {
        content: "";
        position: absolute;
        top: 34px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--ink);
      }
      .st:nth-child(odd)::after {
        right: -60px;
      }
      .st:nth-child(even)::after {
        left: -60px;
      }
      /* reviews */
      .rv {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 28px;
        margin-top: 6vh;
        align-items: start;
      }
      .q {
        background: var(--g2);
        padding: 28px;
        border-radius: 20px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 20px;
      }
      .q:nth-child(1) {
        grid-row: span 2;
        font-size: clamp(22px, 2.2vw, 30px);
      }
      .av {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe56a, #b38e00);
        display: grid;
        place-items: center;
        font: 800 24px var(--sans);
        color: var(--ink);
        box-shadow: 0 0 0 8px rgba(255, 214, 10, 0.16);
      }
      .q p {
        margin: 0 0 12px;
      }
      .q a {
        color: var(--y);
      }
      /* faq */
      details {
        border-top: 2px solid var(--ink);
        padding: 20px 0;
      }
      details:last-of-type {
        border-bottom: 2px solid var(--ink);
      }
      summary {
        font: 800 clamp(22px, 2.6vw, 36px)/1.15 var(--sans);
        letter-spacing: -0.02em;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        gap: 20px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "+";
        font-family: var(--mono);
      }
      details[open] summary::after {
        content: "–";
      }
      details p {
        margin: 14px 0 0;
        max-width: 60ch;
        font-size: 19px;
      }
      /* contact */
      #contact {
        text-align: left;
      }
      #contact h2 {
        margin-bottom: 30px;
      }
      form {
        margin-top: 60px;
        max-width: 620px;
        display: grid;
        gap: 14px;
      }
      label {
        font: 700 13px var(--mono);
        color: var(--mut);
      }
      input,
      textarea {
        width: 100%;
        background: var(--g2);
        border: 2px solid #5a5548;
        color: var(--w);
        padding: 14px 16px;
        border-radius: 12px;
        font: 400 18px var(--sans);
      }
      form .btn {
        justify-self: start;
        background: var(--w);
        font-size: 16px;
        padding: 14px 22px;
      }
      #ok {
        color: var(--y);
        min-height: 1.5em;
      }
      /* footer */
      footer {
        background: #0c0c0b;
        padding: 14vh clamp(20px, 6vw, 96px) 14vh;
        position: relative;
        overflow: hidden;
      }
      footer .nm {
        font: 800 clamp(80px, 22vw, 360px)/0.85 var(--sans);
        letter-spacing: -0.06em;
        margin: 0;
      }
      footer .dot {
        display: inline-block;
        width: 0.16em;

        /* process line, formats tilt */

          fm = $$(".obj>div"),

          pps = $$("#pr .pp");
        function prog() {
          const r = stk.getBoundingClientRect(),
            d = r.height - innerHeight;
          if (d <= 0) return;
          const i = Math.min(2, Math.floor(cl(-r.top / d, 0, 0.999) * 3));
          pps.forEach((e, k) => e.classList.toggle("on", k === i));
        }
        document.addEventListener("pointermove", (e) => {
          mx = (e.clientX / innerWidth) * 2 - 1;
          my = (e.clientY / innerHeight) * 2 - 1;
          fm.forEach((o) => (o.style.transform = "rotateY(" + mx * 28 + "deg) rotateX(" + -my * 14 + "deg)"));
        });
        /* timeline bar + cut flash */
        const tc = $("#tc"),
          fill = $(".fill"),
          phd = $(".ph"),
          trk = $("#bar .tr"),
          fl = $("#fl"),
          rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function ticks() {
          $$(".tk").forEach((t) => t.remove());
          const H = document.documentElement.scrollHeight - innerHeight;
          $$("section[data-cut]").forEach((s) => {
            const t = document.createElement("i");
            t.className = "tk";
            t.style.left = (s.offsetTop / H) * 100 + "%";
            trk.appendChild(t);
          });
        }
        function onScroll() {
          const H = document.documentElement.scrollHeight - innerHeight,
            p = cl(scrollY / H, 0, 1),
            s = p * 180,
            f = (n) => String(Math.floor(n)).padStart(2, "0");
          tc.textContent = f(s / 60) + ":" + f(s % 60) + ":" + f((s % 1) * 30);
          fill.style.width = phd.style.left = p * 100 + "%";
          prog();
          const r = pl.getBoundingClientRect();
          pl.style.setProperty("--f", cl((innerHeight * 0.6 - r.top) / r.height, 0, 1));
        }
        addEventListener("scroll", onScroll, { passive: true });
        if (!rm && window.IntersectionObserver) {
          const io = new IntersectionObserver(
            (es) =>
              es.forEach((e) => {
                if (e.isIntersecting && scrollY > 50) {
                  fl.className = "";
                  fl.classList.toggle("hard", e.target.id === "pause");
                  void fl.offsetWidth;
                  fl.classList.add("on");
                }
              }),
            { rootMargin: "0px 0px -90% 0px" },
          );
          $$("section[data-cut]").forEach((s) => io.observe(s));
        }
        addEventListener("resize", () => {
          ticks();
          onScroll();
        });
        addEventListener("load", () => {
          ticks();
          onScroll();
        });
        ticks();
        onScroll();
        /* WebGL */
        let gl = false;
        try {
          const c = document.createElement("canvas");
          gl = !!(c.getContext("webgl2") || c.getContext("webgl"));
        } catch (e) {}
        if (!gl || rm || !window.THREE) {
          document.documentElement.classList.add("static");
          return;
        }
        try {
          init3D();
        } catch (e) {
          document.documentElement.classList.add("static");
        }
        function init3D() {
          const T = THREE,
            Y = 0xffd60a,
            G = 0x1b1a17,
            C = 0xf3eee4,
            D = 9,
            K = 0.012;
          const r = new T.WebGLRenderer({ canvas: $("#gl"), antialias: true, alpha: true, powerPreference: "high-performance" });
          r.setClearColor(0, 0);
          r.autoClear = false;
          r.outputEncoding = T.sRGBEncoding;
          $("#gl").addEventListener("webglcontextlost", () => document.documentElement.classList.add("static"));
          const PR = [Math.min(devicePixelRatio || 1, 2), 1.5, 1],
            LV = 0;
          let lv = 0;
          r.setPixelRatio(PR[0]);
          const sc = new T.Scene(),
            cam = new T.PerspectiveCamera(40, 1, 0.1, 400);
          sc.add(cam);
          sc.fog = new T.Fog(0x171613, 12, 38);
          sc.add(new T.HemisphereLight(0xfff4e0, 0x1a1812, 0.7));
          const p1 = new T.PointLight(0xfff0d0, 0.9, 50);
          p1.position.set(2, 3, 2);
          cam.add(p1);
          const p2 = new T.PointLight(Y, 0.8, 40);
          p2.position.set(-3, -2, -4);
          cam.add(p2);
          const mS = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.45, metalness: 0.15 }, o || {}));
          const mY = mS(Y, { emissive: Y, emissiveIntensity: 0.4 }),
            mG = mS(0x2c2a25),
            mC = mS(0xb4ae9f),
            mD = mS(G);
          function tex(w, h, fn) {
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            fn(c.getContext("2d"), w, h);
            const t = new T.CanvasTexture(c);
            t.encoding = T.sRGBEncoding;
            t.anisotropy = 4;
            return t;
          }
          const tones = [
            ["#3a3630", "#1b1a17"],
            ["#6b5a3a", "#2a2418"],
            ["#5a5448", "#201e1a"],
          ];
          function ph(v, tag, sub, i) {
            const tn = tones[i % 3];
            return tex(v ? 360 : 640, v ? 640 : 360, (x, w, h) => {
              const g = x.createLinearGradient(0, 0, w, h);
              g.addColorStop(0, tn[0]);
              g.addColorStop(1, tn[1]);
              x.fillStyle = g;
              x.fillRect(0, 0, w, h);
              x.fillStyle = "rgba(255,255,255,.07)";
              for (let i = 0; i < h; i += 26) x.fillRect(0, i, w, 2);
              x.fillStyle = "#ffd60a";
              x.fillRect(20, 20, 12, 12);
              x.fillStyle = "#fff";
              x.font = "bold 24px monospace";
              x.fillText(tag, 42, 31);
              x.font = "20px monospace";
              x.fillStyle = "#e8e2d4";
              x.fillText(sub, 20, h - 24);
              x.fillStyle = "rgba(255,255,255,.9)";
              x.beginPath();
              x.moveTo(w / 2 - 18, h / 2 - 26);
              x.lineTo(w / 2 + 26, h / 2);
              x.lineTo(w / 2 - 18, h / 2 + 26);
              x.fill();
            });
          }
          function frame(v, w, tag, sub, i) {
            const h = v ? (w * 16) / 9 : (w * 9) / 16,
              g = new T.Group();
            const b = new T.Mesh(new T.BoxGeometry(w + 0.12, h + 0.12, 0.05), mD);
            const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: ph(v, tag, sub, i) }));
            m.position.z = 0.03;
            const pb = new T.Mesh(new T.PlaneGeometry(w * 0.9, 0.06), new T.MeshBasicMaterial({ color: Y }));
            pb.position.set(0, -h / 2 + 0.14, 0.04);
            pb.visible = false;
            g.add(b, m, pb);
            g.userData = { m, pb, w, h, e: 0, hit: false };
            m.userData.g = g;
            return g;
          }
          const gH = new T.Group(),
            gB = new T.Group(),
            gW = new T.Group(),
            gT = new T.Group(),
            mon = new T.Group();
          sc.add(gH, gB, gW, gT, mon);
          /* hero scraps */
          const scr = [],
            sm = [mY, mC, mG, mS(0x6b5a3a)];
          for (let i = 0; i < 16; i++) {
            const v = Math.random() < 0.6,
              w = 0.5 + Math.random() * 0.5,
              m = new T.Mesh(new T.BoxGeometry(v ? w : w * 1.7, v ? w * 1.7 : w, 0.03), sm[i % 4]);
            const sd = i % 2 ? 1 : -1;
            m.userData = { bx: sd * (2.8 + Math.random() * 3.4), by: (Math.random() - 0.5) * 6, bz: 1.5 - Math.random() * 5, s: 0.2 + Math.random() * 0.4, i };
            m.rotation.set(Math.random(), Math.random(), Math.random());
            gH.add(m);
            scr.push(m);
          }
          /* before/after ghosts */
          function own(g) {
            const b = g.children[0];
            b.material = b.material.clone();
            [g.children[0], g.children[1]].forEach((o) => (o.material.transparent = true));
          }
          const fade = (g, o) => {
              g.children[0].material.opacity = o;
              g.children[1].material.opacity = o;
              g.visible = o > 0.01;
            },
            sm3 = (x) => x * x * (3 - 2 * x);
          const ga = frame(true, 2.3, "СЫРОЙ", "кадр до", 0),
            gb = frame(true, 2.3, "ГОТОВЫЙ", "кадр после", 1);
          own(ga);
          own(gb);
          gB.add(ga, gb);
          /* works strip */
          const R = 9,
            piv = new T.Group();
          gW.add(piv);
          const bt = tex(512, 256, (x, w, h) => {
            x.fillStyle = "#14130f";
            x.fillRect(0, 0, w, h);
            x.fillStyle = "#3a362e";
            for (let i = 0; i < 8; i++) {
              x.fillRect(i * 64 + 22, 14, 22, 22);
              x.fillRect(i * 64 + 22, h - 36, 22, 22);
            }
          });
          bt.wrapS = T.RepeatWrapping;
          bt.repeat.set(40, 1);
          const band = new T.Mesh(new T.CylinderGeometry(R + 0.06, R + 0.06, 4.6, 96, 1, true, Math.PI - 2.2, 4.4), new T.MeshBasicMaterial({ map: bt, side: T.DoubleSide }));
          piv.add(band);
          const WS = 0.43,
            WG = 0.22;
          const WK = DATA.works.items.map((w) => [w.v, w.tag, w.sub]);
          const fr = [];
          let ws = WK.map((k) => (k[0] ? 1.6 : 3.4) * WS),
            tot = ws.reduce((a, b) => a + b + WG, 0),
            cur = -tot / 2;
          WK.forEach((k, i) => {
            const f = frame(!!k[0], ws[i], k[1], k[2], i);
            f.userData.phi = (cur + ws[i] / 2) / R;
            f.userData.tag = k[1] + " · " + k[2];
            f.userData.w = ws[i];
            cur += ws[i] + WG;
            own(f);
            piv.add(f);
            fr.push(f);
          });
          band.material.transparent = true;
          /* timeline tunnel */
          const bricks = [];
          [-1.9, 1.9].forEach((y) =>
            [-4.2, -2.6, -1, 0.6, 2.2, 3.8].forEach((x, li) => {
              const lane = new T.Mesh(new T.BoxGeometry(0.8, 0.05, 1), mD);
              lane.position.set(x, y, 0);
              gT.add(lane);
              for (let k = 0, z = -0.5; z < 0.5 && k < 30; k++) {
                const l = 0.025 + Math.random() * 0.07,
                  m = Math.random(),
                  mt = m < 0.35 ? mY : m < 0.65 ? mC : mG;
                const b = new T.Mesh(new T.BoxGeometry(0.7, 0.34, l * 0.92), mt);
                b.position.set(x, y + (y > 0 ? -0.2 : 0.2), z + l / 2);
                b.userData.o = k % 2;
                gT.add(b);
                bricks.push(b);
                z += l + 0.01 + Math.random() * 0.03;
              }
            }),
          );
          /* monitor */
          const sh = new T.Mesh(new T.BoxGeometry(3.8, 2.4, 0.14), mD);
          const scrn = new T.Mesh(
            new T.PlaneGeometry(3.6, 2.2),
            new T.MeshBasicMaterial({
              map: tex(640, 360, (x, w, h) => {
                x.fillStyle = "#1b1a17";
                x.fillRect(0, 0, w, h);
                x.fillStyle = "#ffd60a";
                x.fillRect(20, 20, 12, 12);
                x.fillStyle = "#fff";
                x.font = "bold 22px monospace";
                x.fillText("запись экрана монтажа", 44, 32);
                for (let i = 0; i < 5; i++) {
                  let z = 20;
                  while (z < w - 80) {
                    const l = 30 + Math.random() * 110;
                    x.fillStyle = ["#ffd60a", "#f3eee4", "#6b665a"][(Math.random() * 3) | 0];
                    x.fillRect(z, 80 + i * 46, l, 32);
                    z += l + 8;
                  }
                }
                x.fillStyle = "#ffd60a";
                x.fillRect(330, 60, 3, 260);
              }),
            }),
          );
          scrn.position.z = 0.08;
          mon.add(sh, scrn);
          /* layout */
          let asp = 1,
            tops = {};
          const E = { hero: $("#hero"), ba: $("#ba"), works: $("#works"), pr: $("#pr") };
          const rect = (e) => {
            const b = e.getBoundingClientRect();
            return { t: b.top + scrollY, h: b.height };
          };
          const zOf = (e) => {
            const q = rect(e);
            return -(q.t + q.h / 2) * K;
          };
          let Lz = 60,
            baX = 4,
            wB = 1;
          function layout() {
            asp = innerWidth / innerHeight;
            cam.aspect = asp;
            cam.updateProjectionMatrix();
            r.setSize(innerWidth, innerHeight, false);
            gH.position.z = zOf(E.hero);
            gB.position.z = zOf(E.ba);
            gW.position.z = zOf(E.works);
            const q = rect(E.pr);
            Lz = q.h * K * 1.15;
            gT.position.z = -(q.t + q.h / 2) * K;
            gT.scale.z = Lz;
            const xs = cl(asp / 1.5, 0.4, 1);
            scr.forEach((m) => {
              m.userData.xs = xs;
              m.scale.setScalar(asp < 1 ? 0.7 : 1);
            });
            const vis = Math.tan((20 * Math.PI) / 180) * D * asp;
            baX = Math.min(vis * 0.78, 4.8);
            ga.rotation.y = 0.3;
            gb.rotation.y = -0.3;
            wB = asp < 1 ? 0.62 : 1;
          }
          layout();
          addEventListener("resize", layout);
          addEventListener("load", layout);
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
          new ResizeObserver(layout).observe(document.body);
          /* pointer, gyro, raycast */
          const ray = new T.Raycaster(),
            mv = new T.Vector2(9, 9);
          addEventListener("pointermove", (e) => {
            mv.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
          });
          addEventListener("pointerdown", (e) => {
            mv.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
            if (e.pointerType === "touch" && typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
          });
          addEventListener("deviceorientation", (e) => {
            if (e.gamma != null) {
              mx = cl(e.gamma / 30, -1, 1);
              my = cl((e.beta - 45) / 30, -1, 1);
            }
          });
          const wc = $("#wcap");
          let lastH = null;
          /* adaptive quality */
          let a = 0,
            n = 0,
            bad = 0,
            last = performance.now(),
            camz = 0;
          function degrade() {
            lv++;
            if (lv < PR.length) r.setPixelRatio(Math.min(PR[lv], PR[0]));
            else {
              bricks.forEach((b) => {
                if (b.userData.o) b.visible = false;
              });
              scr.forEach((m, i) => {
                if (i % 2) m.visible = false;
              });
            }
          }
          const ease = (c, t, f) => c + (t - c) * f;
          function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min(now - last, 100);
            last = now;
            a += dt;
            if (++n === 90) {
              const av = a / n;
              bad = av > 26 ? bad + 1 : 0;
              if (bad >= 2 && lv < PR.length) {
                degrade();
                bad = 0;
              }
              a = n = 0;
            }
            const tz = -(scrollY + innerHeight / 2) * K + D,
              f = 1 - Math.exp(-dt / 110);
            camz = ease(camz, tz, f);
            cam.position.set(mx * 0.5, -my * 0.3, camz);
            cam.lookAt(mx * 0.3, -my * 0.2, camz - D);
            const t = now / 1000;
            gH.rotation.y = ease(gH.rotation.y, mx * 0.2, 0.08);
            gH.rotation.x = ease(gH.rotation.x, my * 0.1, 0.08);
            scr.forEach((m) => {
              const u = m.userData;
              m.position.set(u.bx * (u.xs || 1), u.by + Math.sin(t * u.s + u.i) * 0.35, u.bz);
              m.rotation.x += 0.002 * u.s;
              m.rotation.y += 0.003 * u.s;
            });
            const qb = rect(E.ba),
              pbb = cl((scrollY + innerHeight / 2 - qb.t) / qb.h, 0, 1),
              sp = 0.5 + 0.5 * Math.sin(pbb * Math.PI),
              go = sm3(cl(pbb / 0.3, 0, 1)) * (1 - sm3(cl((pbb - 0.7) / 0.3, 0, 1)));
            fade(ga, go);
            fade(gb, go);
            ga.position.set(-baX * sp, Math.sin(t * 0.6) * 0.1, -1.5 - (1 - sp) * 2);
            gb.position.set(baX * sp, Math.cos(t * 0.6) * 0.1, -1.5 - (1 - sp) * 2);
            /* works */
            const q = rect(E.works),
              e0 = cl((scrollY + innerHeight - q.t) / (innerHeight * 0.9), 0, 1),
              ap = sm3(e0);
            band.material.opacity = ap;
            fr.forEach((f) => fade(f, ap));
            gW.visible = ap > 0.01;
            gW.scale.setScalar(wB * (0.86 + 0.14 * ap));
            const pt = cl((scrollY + innerHeight / 2 - q.t) / q.h, 0, 1);
            const thv = Math.atan(Math.tan((20 * Math.PI) / 180) * asp) * 0.9,
              phs = tot / 2 / R,
              lim = Math.max(0, phs - thv),
              pp = cl((scrollY - q.t) / Math.max(1, q.h - innerHeight), 0, 1);
            piv.rotation.y = ease(piv.rotation.y, (pp - 0.5) * 2 * lim, 0.1);
            piv.position.z = (camz - gW.position.z) / wB;
            ray.setFromCamera(mv, cam);
            const hits = ray.intersectObjects(fr.map((f) => f.userData.m));
            let hf = hits.length ? hits[0].object.userData.g : null;
            if (hf !== lastH) {
              lastH = hf;
              wc.innerHTML = hf ? "<span>" + hf.userData.tag + "</span>" : matchMedia("(hover:none)").matches ? DATA.works.hintTouch : DATA.works.hint;
            }
            fr.forEach((g) => {
              const u = g.userData,
                e = (u.hit = g === hf) ? 1 : 0;
              u.e = ease(u.e, e, 0.12);
              const rr = R - 0.45 - 1.5 * u.e;
              g.position.set(rr * Math.sin(u.phi), 0, -rr * Math.cos(u.phi));
              g.rotation.y = -u.phi;
              g.scale.setScalar(1 + 0.12 * u.e);
              u.pb.visible = u.e > 0.3;
              u.pb.scale.x = 0.05 + ((t * 0.25) % 1) * 0.95;
              u.pb.position.x = -u.w * 0.45 + (u.w * 0.9 * u.pb.scale.x) / 2;
            });
            /* principles monitor follows camera */
            const lz = camz - gT.position.z - D,
              vs = Math.tan((20 * Math.PI) / 180) * D * asp;
            mon.position.set(vs * 0.5, 0, gT.position.z + cl(lz, -Lz / 2, Lz / 2));
            mon.scale.setScalar(cl((vs * 0.8) / 3.8, 0.6, 1.35));
            mon.rotation.y = -0.3;
            mon.visible = innerWidth > 820;
            /* каждая 3D-сцена рисуется только внутри своей секции: за жёлтой полоской «склейки» чужого пространства не видно */
            const all = [gH, gB, gW, gT, mon],
              regs = [
                [E.hero, gH],
                [E.ba, gB],
                [E.works, gW],
                [E.pr, [gT, mon]],
              ],
              v0 = all.map((o) => o.visible);
            r.setScissorTest(false);
            r.clear();
            r.setScissorTest(true);
            regs.forEach(([el, gs]) => {
              const b = el.getBoundingClientRect(),
                t = Math.max(0, b.top),
                bt = Math.min(innerHeight, b.bottom);
              if (bt <= t) return;
              const own = [].concat(gs);
              all.forEach((o, i) => (o.visible = own.includes(o) && v0[i]));
              r.setScissor(0, innerHeight - bt, innerWidth, bt - t);
              r.clearDepth();
              r.render(sc, cam);
            });
            all.forEach((o, i) => (o.visible = v0[i]));
            r.setScissorTest(false);
          }
          requestAnimationFrame(loop);
        }
      })();
    </script>
  </body>
